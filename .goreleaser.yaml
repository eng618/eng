# Documentation at https://goreleaser.com

# The lines below are called `modelines`. See `:help modeline`
# Feel free to remove those if you don't want/need to use them.
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

project_name: eng

before:
  hooks:
    # You may remove this if you don't use go modules.
    - go mod tidy
    # you may remove this if you don't need go generate
    # - go generate ./...

builds:
  - # Path to main package or binary
    main: .
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    # Inject version info using ldflags and Goreleaser's template variables
    ldflags:
      - -s -w # Strip symbols and debug info
      - -X github.com/eng618/eng/cmd/version.Version={{.Version}}
      - -X github.com/eng618/eng/cmd/version.Commit={{.ShortCommit}} # Use ShortCommit for brevity
      - -X github.com/eng618/eng/cmd/version.Date={{.Date}} # Use GoReleaser's build date

archives:
  - formats:
      - tar.gz
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: zip
checksum:
  name_template: "checksums.txt"
snapshot:
  # Use commit hash for snapshot version template for clarity
  version_template: "{{ .ShortCommit }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "(?i)skip ci" # Exclude common skip patterns
      - '^chore\(release\):' # Exclude goreleaser's own release commits
      - '^chore\(CHANGELOG\):' # Exclude changelog update commits

brews:
  - name: eng
    repository:
      owner: eng618
      name: homebrew-eng
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: Eric N. Garcia
      email: eng618@garciaericn.com
    commit_msg_template: "Update eng to {{ .Tag }}"
    directory: Formula
    homepage: "https://github.com/eng618/eng"
    description: "Personal CLI to help facilitate my normal workflow"
    license: "MIT"
    install: |
      bin.install "eng"
      generate_completions_from_executable(bin/"eng", "completion")
    test: |
      assert_match version.to_s, shell_output("#{bin}/eng --version")
      assert_match "USAGE", shell_output("#{bin}/eng --help")
